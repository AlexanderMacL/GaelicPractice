<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d5c48">
  <title>Gaelic Practice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Gaelic Practice</span>
      <nav id="menu" class="menu" aria-label="Practice topics"></nav>
    </div>
  </header>

  <main>
    <section id="practice" class="view" hidden>
      <h1 id="topic-title" class="topic-title"></h1>
      <div class="card">
        <p class="prompt">Translate into Gaelic:</p>
        <p id="sentence" class="sentence" aria-live="polite"></p>
        <ol id="legend" class="legend" aria-label="Lists used"></ol>
      </div>
      <div class="actions">
        <button id="next" class="btn-primary" type="button">Next</button>
      </div>
    </section>

    <section id="editor" class="view editor" hidden></section>
  </main>

  <script src="js/starter.js"></script>
  <script src="js/database.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
